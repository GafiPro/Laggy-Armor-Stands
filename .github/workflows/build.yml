name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle build --no-daemon --max-workers=1
      - name: Verify produced mod
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'laggyarmorstands-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -Fx 'me/gafipro/laggyarmorstands/LaggyArmorStands.class'
          jar tf "$JAR" | grep -Fx 'me/gafipro/laggyarmorstands/mixin/EntityTickMixin.class'
          jar tf "$JAR" | grep -Fx 'me/gafipro/laggyarmorstands/mixin/EntityRenderManagerMixin.class'
          jar tf "$JAR" | grep -Fx 'laggyarmorstands.mixins.json'
          unzip -p "$JAR" fabric.mod.json | python -m json.tool >/dev/null
          unzip -p "$JAR" fabric.mod.json | grep -F '"id": "laggyarmorstands"'
          unzip -p "$JAR" fabric.mod.json | grep -F '"version": "1.0.1"'
          unzip -p "$JAR" fabric.mod.json | grep -F '"minecraft": "1.21.11"'
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: laggy-armor-stands-1.21.11
          path: ${{ steps.verify.outputs.jar }}
          if-no-files-found: error
          retention-days: 30
